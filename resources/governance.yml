# =============================================================================
# resources/governance.yml — post-deploy grants (ALL customers)
# -----------------------------------------------------------------------------
# Included by databricks.yml. Grants BOTH the app SP and the persona SPs their
# runtime access — so the whole thing is coded through DABs, no manual clicks:
#   App SP:
#     * READ on the persona secret scope (${var.secret_scope})
#     * USE CATALOG, USE SCHEMA, SELECT, EXECUTE, MODIFY, CREATE TABLE on
#       ${var.catalog}  (tools + write gold.agent_turn_log)
#   Persona SPs (the model / Genie / UC-function calls run AS these):
#     * EXECUTE on the system.ai Gateway model (${var.claude_model})
#     * CAN_USE on the SQL warehouse (${var.warehouse_id})
#     * CAN_RUN on the Genie space (best-effort via API; manual fallback logged)
#     * catalog data: MANAGER = full; ANALYST = restricted (no promo) — the
#       per-persona UC-enforcement demo.
#
# The app SP only exists AFTER `bundle deploy`, so run this LAST:
#   deploy -> apply_ddl -> seed_data -> run_pipeline -> register_functions
#          -> setup_lakebase -> create_genie_space -> grant_service_principals
# Idempotent. Run AS a principal with MANAGE on the scope, owner/MANAGE GRANT on
# the catalog, and grant rights on system.ai (the organizer/admin).
#
# NOTE: the app's warehouse + Lakebase access are granted declaratively by the app
# `resources` block in resources/app.yml — not here.
# =============================================================================

resources:
  jobs:

    grant_service_principals:
      name: "[${bundle.target}] cerebro grant_service_principals (${var.catalog})"
      tasks:
        - task_key: grant_service_principals
          notebook_task:
            notebook_path: ../src/governance/grant_service_principals.py
            base_parameters:
              catalog: ${var.catalog}
              customer_slug: ${var.customer_slug}
              secret_scope: ${var.secret_scope}
              warehouse_id: ${var.warehouse_id}
              claude_model: "system.ai.claude-sonnet-4-5"
              genie_space_id: ""     # blank => read from src/app/config/<customer>.yaml
              app_name: ""           # blank => cerebro-assistant-${var.customer_slug}
              analyst_sp_name: "cerebro-persona-analyst"
              manager_sp_name: "cerebro-persona-manager"
